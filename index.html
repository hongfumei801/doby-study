<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦉 Doby 的期末考複習樂園 — G5 Final Exam</title>
<style>
  :root{
    --bg:#f4f7ff; --card:#ffffff; --ink:#243047; --muted:#6b7894;
    --p1:#7c5cff; --p2:#22c1c3; --p3:#ffb020; --p4:#ff6b9d; --good:#27c093; --bad:#ff5d6c;
    --line:#e7ecf7; --soft:#f0f3fc;
    --shadow:0 8px 24px rgba(60,80,160,.12);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    font-family:'Segoe UI','Microsoft JhengHei','PingFang TC',system-ui,sans-serif;
    background:linear-gradient(180deg,#eef2ff,#f7f9ff 240px);
    color:var(--ink); line-height:1.6; padding-bottom:60px;
  }
  header.top{
    background:linear-gradient(120deg,var(--p1),var(--p2));
    color:#fff; padding:26px 18px 22px; text-align:center; position:relative;
    border-radius:0 0 26px 26px; box-shadow:var(--shadow);
  }
  header.top h1{margin:0; font-size:1.9rem; letter-spacing:.5px}
  header.top p{margin:6px 0 0; opacity:.95; font-size:.98rem}
  .allzh{
    margin-top:14px; display:inline-block; background:rgba(255,255,255,.22);
    border:1.5px solid rgba(255,255,255,.6); color:#fff; padding:8px 16px;
    border-radius:999px; cursor:pointer; font-size:.92rem; font-weight:600;
    backdrop-filter:blur(4px);
  }
  .allzh:hover{background:rgba(255,255,255,.34)}
  .voicebar{margin-top:12px; font-size:.9rem; color:#fff}
  .voicebar select{border-radius:999px; border:1.5px solid rgba(255,255,255,.65); background:rgba(255,255,255,.95); color:var(--ink); padding:5px 12px; font-size:.85rem; max-width:260px; cursor:pointer; font-weight:600}
  .voicehint{font-size:.8rem; opacity:.92}

  nav#tabs{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    padding:14px 10px; position:sticky; top:0; z-index:50;
    background:rgba(247,249,255,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav#tabs button{
    border:none; background:#fff; color:var(--ink); padding:9px 15px;
    border-radius:999px; cursor:pointer; font-size:.95rem; font-weight:600;
    box-shadow:0 2px 8px rgba(60,80,160,.08); transition:.15s;
  }
  nav#tabs button:hover{transform:translateY(-2px)}
  nav#tabs button.active{background:var(--p1); color:#fff; box-shadow:0 4px 14px rgba(124,92,255,.4)}

  main{max-width:920px; margin:18px auto; padding:0 14px}
  .subhead h2{font-size:1.6rem; margin:.2em 0}
  .intro{color:var(--muted); margin-top:0}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:18px 20px; margin:16px 0; box-shadow:var(--shadow);
  }
  .card h3{margin:.1em 0 .6em; font-size:1.18rem; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .lesson h3{color:var(--p1)}
  .fact{margin:.5em 0}
  .note{background:var(--soft); border-left:5px solid var(--p2); padding:10px 14px; border-radius:10px; margin:10px 0}
  .tip{background:#fff7e6; border-left:5px solid var(--p3); padding:10px 14px; border-radius:10px; margin:10px 0}
  .example{background:#eefbf4; border-left:5px solid var(--good); padding:10px 14px; border-radius:10px; margin:10px 0}
  ul.bilist{margin:.4em 0; padding-left:22px}
  ul.bilist li{margin:.35em 0}

  /* bilingual */
  .bi{display:inline}
  .bi .en{}
  .zhbtn{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; margin:0 3px; padding:0; vertical-align:middle;
    border:none; border-radius:50%; background:var(--p4); color:#fff;
    font-size:.72rem; font-weight:700; cursor:pointer; line-height:1;
    box-shadow:0 1px 4px rgba(255,107,157,.5);
  }
  .zhbtn:hover{filter:brightness(1.08)}
  .zhbtn.on{background:var(--good)}
  /* Chinese is HIDDEN by default (fail-safe). Only .zh.show reveals it. */
  .zh{display:none}
  .zh.show{
    display:inline; background:#fff3f8; color:#b5306a; border-radius:6px;
    padding:1px 7px; margin-left:3px; font-size:.96em;
    box-shadow:inset 0 0 0 1px #ffd6e6;
  }
  /* 🔊 pronunciation button */
  .spk{
    border:none; background:var(--p2); color:#fff; border-radius:50%;
    width:24px; height:24px; font-size:.8rem; cursor:pointer; line-height:1;
    margin-left:6px; vertical-align:middle; box-shadow:0 1px 4px rgba(34,193,195,.5);
  }
  .spk:hover{filter:brightness(1.08)}
  .spk:active{transform:scale(.9)}
  th .spk,td .spk{width:19px; height:19px; font-size:.66rem; margin-left:4px}
  th .spk{background:#fff; color:var(--p1)}
  .vterm{cursor:pointer}
  .vterm:hover{text-decoration:underline}

  /* tables */
  .tablewrap{overflow-x:auto; margin:12px 0}
  table{border-collapse:collapse; width:100%; font-size:.95rem}
  th,td{border:1px solid var(--line); padding:9px 11px; text-align:left; vertical-align:top}
  th{background:var(--p1); color:#fff; font-weight:600}
  tbody tr:nth-child(even){background:var(--soft)}

  /* vocab */
  .vocabgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
  .vcard{background:var(--soft); border-radius:14px; padding:12px 14px; border:1px solid var(--line)}
  .vterm{font-weight:800; color:var(--p1); font-size:1.08rem; margin-bottom:3px}
  .vdef{font-size:.93rem}

  /* subject cards (home) */
  .scards{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-top:8px}
  .scard{cursor:pointer; border-radius:18px; padding:20px; color:#fff; text-align:center; transition:.15s; box-shadow:var(--shadow); border:none}
  .scard:hover{transform:translateY(-4px) scale(1.02)}
  .scard .se{font-size:2.4rem; display:block}
  .scard .st{font-weight:800; font-size:1.15rem; margin-top:6px}
  .scard .ss{font-size:.85rem; opacity:.9}

  /* quiz */
  .quizcard h3{color:var(--p4)}
  .q{padding:12px 0; border-bottom:1px dashed var(--line)}
  .q:last-of-type{border-bottom:none}
  .qtext{font-weight:600; margin-bottom:8px}
  .newbadge{display:inline-block; background:linear-gradient(135deg,#ff6b9d,#ff9a6b); color:#fff; font-size:.68rem; font-weight:800; padding:2px 9px; border-radius:999px; margin-right:7px; vertical-align:middle; letter-spacing:.4px; box-shadow:0 1px 5px rgba(255,107,157,.5)}
  .opts{display:flex; flex-direction:column; gap:8px}
  .opt{
    background:#fff; border:2px solid var(--line); border-radius:12px;
    padding:9px 13px; cursor:pointer; transition:.12s; font-size:.96rem;
  }
  .opt:hover{border-color:var(--p1); background:var(--soft)}
  .opt.done{cursor:default}
  .opt.correct{border-color:var(--good); background:#e7faf2; font-weight:700}
  .opt.wrong{border-color:var(--bad); background:#ffecef}
  .explain{margin-top:8px; background:#fff7e6; border-radius:10px; padding:8px 12px; font-size:.92rem}
  .scorebar{margin-top:14px; font-weight:800; font-size:1.05rem; background:var(--soft); border-radius:12px; padding:10px 14px; text-align:center}
  .scorebar.win{background:#e7faf2; color:#0c8f63}
  .btn{border:none; border-radius:12px; padding:9px 16px; font-weight:700; cursor:pointer; background:var(--p1); color:#fff; margin-top:10px}
  .btn.small{padding:6px 12px; font-size:.9rem}
  .btn.reset{background:var(--p2)}
  .btn:hover{filter:brightness(1.06)}

  /* match game */
  .hint{color:var(--muted); font-size:.9rem; margin:.2em 0 .8em}
  .matchwrap{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .mcol{display:flex; flex-direction:column; gap:8px}
  .mcell{border:2px solid var(--line); background:#fff; border-radius:12px; padding:10px; cursor:pointer; text-align:center; font-size:.95rem; transition:.12s}
  .mcell:hover{border-color:var(--p2)}
  .mcell.sel{border-color:var(--p1); background:var(--soft); transform:scale(1.02)}
  .mcell.matched{border-color:var(--good); background:#e7faf2; color:#0c8f63; cursor:default; opacity:.75}
  .mcell.flash{border-color:var(--bad); background:#ffecef}

  /* sort game */
  .tray{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
  .chip{border:2px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; cursor:pointer; font-size:.92rem; transition:.12s}
  .chip:hover{border-color:var(--p3)}
  .chip.sel{border-color:var(--p1); background:var(--soft); transform:scale(1.05)}
  .chip.flash{border-color:var(--bad); background:#ffecef}
  .chip.hidden{display:none}
  .buckets{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .bucket{border:2.5px dashed var(--p2); border-radius:16px; padding:12px; min-height:90px; cursor:pointer; transition:.12s}
  .bucket:hover{background:var(--soft)}
  .bktitle{font-weight:800; color:var(--p2); text-align:center; margin-bottom:8px}
  .bkitems{display:flex; flex-wrap:wrap; gap:6px}
  .bkchip{background:#e7faf2; color:#0c8f63; border-radius:999px; padding:6px 12px; font-size:.88rem; font-weight:600}

  /* math practice */
  .mathq{padding:10px 0; border-bottom:1px dashed var(--line)}
  .mathq:last-of-type{border-bottom:none}
  .mathrow{display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap}
  .mans{border:2px solid var(--line); border-radius:10px; padding:8px 12px; font-size:1rem; width:140px}
  .mans:focus{border-color:var(--p1); outline:none}
  .mfb{font-weight:700}
  .mfb.ok{color:var(--good)}
  .mfb.no{color:var(--bad)}

  /* effects */
  .star{position:absolute; font-size:1.6rem; animation:floatup .9s ease-out forwards; pointer-events:none}
  @keyframes floatup{0%{opacity:1; transform:translateY(0) scale(.6)}100%{opacity:0; transform:translateY(-46px) scale(1.4)}}
  .confetti{position:fixed; top:-30px; font-size:1.4rem; z-index:999; pointer-events:none; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(102vh) rotate(540deg); opacity:.9}}

  footer{text-align:center; color:var(--muted); font-size:.85rem; margin-top:30px}
  @media(max-width:560px){
    .matchwrap,.buckets{grid-template-columns:1fr}
    header.top h1{font-size:1.5rem}
  }
</style>
</head>
<body>
<header class="top">
  <h1>🦉 Doby 的期末考複習樂園</h1>
  <p>Grade 5 Final Exam · June 2026 · Korrnell Academy</p>
  <button id="allzhbtn" class="allzh" onclick="toggleAllZh()">🌏 顯示全部中文</button>
  <div id="voicebar" class="voicebar" style="display:none">🔊 美式語音：<select id="voicePick" onchange="setVoice(this.value)" title="選擇朗讀語音（選了會試唸）"></select><span id="voicehint" class="voicehint" style="display:none">　建議用 Microsoft Edge 開啟，可得更自然的語音 ✨</span></div>
</header>

<nav id="tabs"></nav>
<main id="content"></main>
<footer>made with ❤️ for Doby — 加油！You can do it! 💪</footer>

<script>
/* ============================================================
   ENGINE  (bilingual / vocab / quiz / match / sort / math)
   ============================================================ */
const CONTENT = window.CONTENT = {};
const TAB_ORDER = [
  {key:'home',    label:'🏠 首頁'},
  {key:'science', label:'🔬 Science'},
  {key:'reading', label:'📖 Reading'},
  {key:'grammar', label:'✍️ Grammar'},
  {key:'math',    label:'🔢 Math'},
];
let activeKey='home', biCounter=0, allZh=false;

/* ---- bilingual reveal (class-based: hidden by default, .show reveals) ---- */
function bi(en,zh){
  const id='z'+(biCounter++);
  return `<span class="bi"><span class="en">${en}</span>`
       + `<button class="zhbtn" type="button" title="顯示中文" onclick="event.stopPropagation();toggleZh('${id}',this)">中</button>`
       + `<span class="zh" id="${id}">${zh}</span></span>`;
}
function syncAllZh(){          // keep the global button label honest with the actual DOM
  const total=document.querySelectorAll('.zh').length;
  const shown=document.querySelectorAll('.zh.show').length;
  allZh = total>0 && shown===total;
  const t=document.getElementById('allzhbtn'); if(t) t.textContent = allZh?'🙈 隱藏全部中文':'🌏 顯示全部中文';
}
function toggleZh(id,btn){const e=document.getElementById(id); if(!e)return; const on=e.classList.toggle('show'); if(btn)btn.classList.toggle('on',on); syncAllZh();}
function toggleAllZh(){        // if anything is hidden -> show all; otherwise hide all (derived from DOM, not a stale flag)
  const total=document.querySelectorAll('.zh').length;
  const shown=document.querySelectorAll('.zh.show').length;
  const turnOn = shown < total;
  document.querySelectorAll('.zh').forEach(e=>e.classList.toggle('show',turnOn));
  document.querySelectorAll('.zhbtn').forEach(b=>b.classList.toggle('on',turnOn));
  allZh=turnOn;
  document.getElementById('allzhbtn').textContent = turnOn?'🙈 隱藏全部中文':'🌏 顯示全部中文';
}

/* ---- 🔊 pronunciation (Web Speech API, works offline in most browsers) ---- */
/* ---- voice selection: prefer a NATURAL American (en-US) voice ---- */
let PREFERRED_VOICE = null, userPickedVoice = false;
function voiceScore(v){
  const n=(v.name||'').toLowerCase(), lang=(v.lang||'').toLowerCase().replace('_','-');
  let s=0;
  if(n.indexOf('natural')>=0) s+=100;            // MS neural "Online (Natural)" — very human
  if(n.indexOf('online')>=0) s+=40;
  if(n.indexOf('google')>=0) s+=80;              // "Google US English" (Chrome) — natural
  if(/aria|jenny|ava|emma|michelle|ana/.test(n)) s+=30;   // good female neural
  if(/guy|andrew|brian|eric|christopher/.test(n)) s+=25;  // good male neural
  if(/samantha/.test(n)) s+=60;                  // Apple Samantha — very natural
  if(/zira|david|mark/.test(n)) s+=8;            // MS SAPI US — American but robotic (last resort)
  if(lang==='en-us') s+=20;
  return s;
}
function usVoices(){
  const voices=(window.speechSynthesis.getVoices()||[]);
  const us=voices.filter(v=>(v.lang||'').toLowerCase().replace('_','-').indexOf('en-us')===0);
  const list=(us.length?us:voices.filter(v=>(v.lang||'').toLowerCase().indexOf('en')===0)).slice();
  list.sort((a,b)=>voiceScore(b)-voiceScore(a));
  return list;
}
function ensureVoice(){ if(!PREFERRED_VOICE){ const l=usVoices(); if(l.length) PREFERRED_VOICE=l[0]; } return PREFERRED_VOICE; }
function setVoice(name){ const v=(window.speechSynthesis.getVoices()||[]).find(x=>x.name===name); if(v){ PREFERRED_VOICE=v; userPickedVoice=true; speak('Hi Doby! This is how I sound. Let’s study!'); } }
function populateVoicePicker(){
  const sel=document.getElementById('voicePick'), bar=document.getElementById('voicebar'); if(!sel) return;
  const list=usVoices();
  if(!list.length){ if(bar) bar.style.display='none'; return; }
  if(bar) bar.style.display='';
  ensureVoice();
  sel.innerHTML=list.map(v=>`<option value="${v.name}">${v.name.replace('Microsoft ','').replace(/ ?- ?English.*$/i,'').replace('Online (Natural)','✨自然').replace('(Natural)','✨')}</option>`).join('');
  if(PREFERRED_VOICE) sel.value=PREFERRED_VOICE.name;
  const hint=document.getElementById('voicehint');
  if(hint){ const best=list[0]; hint.style.display=/natural|google|samantha|online|aria|jenny|guy|andrew/i.test(best.name||'')?'none':'inline'; }
}
function speak(text){
  try{
    if(!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=ensureVoice();
    if(v){ u.voice=v; u.lang=v.lang||'en-US'; } else { u.lang='en-US'; }
    u.rate=0.95; u.pitch=1.0;     // natural pace, neutral pitch (was dragging/robotic)
    window.speechSynthesis.speak(u);
  }catch(e){}
}
if('speechSynthesis' in window){
  window.speechSynthesis.getVoices();   // kick off async voice loading
  window.speechSynthesis.onvoiceschanged=function(){ if(!userPickedVoice){ PREFERRED_VOICE=null; ensureVoice(); } populateVoicePicker(); };
}
function speakEl(el){ if(el) speak(el.getAttribute('data-say')); }
// reads the English (.en) found inside the speaker button's parent block — no attribute escaping needed
function speakBlock(btn){ const p=btn.parentElement; if(!p) return; const en=p.querySelector('.en'); if(en) speak(en.textContent); }
function spk(){ return '<button class="spk" type="button" title="聽發音 / read aloud" onclick="event.stopPropagation();speakBlock(this)">🔊</button>'; }

/* ---- block rendering ---- */
function renderBlock(b){
  switch(b.type){
    case 'fact':    return `<p class="fact">${bi(b.en,b.zh)}${spk()}</p>`;
    case 'note':    return `<div class="note">${bi(b.en,b.zh)}${spk()}</div>`;
    case 'tip':     return `<div class="tip">💡 ${bi(b.en,b.zh)}${spk()}</div>`;
    case 'example': return `<div class="example">📌 ${bi(b.en,b.zh)}${spk()}</div>`;
    case 'list':    return '<ul class="bilist">'+b.items.map(it=>`<li>${bi(it.en,it.zh)}${spk()}</li>`).join('')+'</ul>';
    case 'table':   return renderTable(b);
    case 'html':    return b.html;
    case 'subjectcards': return renderSubjectCards();
    default: return '';
  }
}
function renderTable(b){
  let h='<div class="tablewrap"><table><thead><tr>'+b.cols.map(c=>`<th>${bi(c.en,c.zh)}${spk()}</th>`).join('')+'</tr></thead><tbody>';
  b.rows.forEach(r=>{h+='<tr>'+r.map(c=>`<td>${bi(c.en,c.zh)}${spk()}</td>`).join('')+'</tr>';});
  return h+'</tbody></table></div>';
}
function renderVocab(arr){
  return '<div class="vocabgrid">'+arr.map(v=>`<div class="vcard"><div><span class="vterm" data-say="${v.term}" title="點一下聽發音" onclick="speakEl(this)">${v.term}</span><button class="spk" type="button" title="聽發音" data-say="${v.term}" onclick="speakEl(this)">🔊</button></div><div class="vdef">${bi(v.en,v.zh)}${spk()}</div></div>`).join('')+'</div>';
}
function renderSubjectCards(){
  const cards=[
    {k:'science',e:'🔬',t:'Science',s:'地球的水系統',c:'linear-gradient(135deg,#22c1c3,#2a8cff)'},
    {k:'reading',e:'📖',t:'Reading',s:'故事 · 概念 · 單字',c:'linear-gradient(135deg,#7c5cff,#b06bff)'},
    {k:'grammar',e:'✍️',t:'Grammar & Writing',s:'文法 · 寫作',c:'linear-gradient(135deg,#ff6b9d,#ff9a6b)'},
    {k:'math',e:'🔢',t:'Math',s:'時間 · 體積 · 百分比 · 對稱',c:'linear-gradient(135deg,#ffb020,#ff7a59)'},
  ];
  return '<div class="scards">'+cards.map(c=>`<button class="scard" style="background:${c.c}" onclick="show('${c.k}')"><span class="se">${c.e}</span><span class="st">${c.t}</span><span class="ss">${c.s}</span></button>`).join('')+'</div>';
}

/* ---- subject page ---- */
function renderSubject(key){
  const c=CONTENT[key];
  if(!c) return '<div class="card">內容載入中… (還沒做好這一科)</div>';
  let h='<section class="subject">';
  h+=`<div class="subhead"><h2>${c.emoji||''} ${bi(c.title.en,c.title.zh)}${spk()}</h2>`;
  if(c.intro) h+=`<p class="intro">${bi(c.intro.en,c.intro.zh)}${spk()}</p>`;
  h+='</div>';
  (c.sections||[]).forEach(s=>{
    h+=`<div class="card lesson"><h3>${bi(s.heading.en,s.heading.zh)}${spk()}</h3>`;
    (s.blocks||[]).forEach(b=> h+=renderBlock(b));
    h+='</div>';
  });
  if(c.vocab&&c.vocab.length){
    h+=`<div class="card"><h3>📚 ${bi('Vocabulary','單字表 (點 中 看中文)')}</h3>`+renderVocab(c.vocab)+'</div>';
  }
  if(c.match){
    h+=`<div class="card game"><h3>🎯 ${bi(c.match.title.en,c.match.title.zh)}</h3><div id="match-${key}"></div></div>`;
  }
  (c.sorts||[]).forEach((s,i)=>{
    h+=`<div class="card game"><h3>🗂️ ${bi(s.title.en,s.title.zh)}</h3><div id="sort-${key}-${i}"></div></div>`;
  });
  (c.mathSets||[]).forEach((m,i)=>{
    h+=`<div class="card game"><h3>🧮 ${bi(m.title.en,m.title.zh)}</h3><div id="math-${key}-${i}"></div></div>`;
  });
  if(c.quiz&&c.quiz.length){
    h+=`<div class="card quizcard"><h3>📝 ${bi('Quiz — Test Yourself!','小測驗 — 考考自己！')}</h3><div id="quiz-${key}"></div></div>`;
  }
  return h+'</section>';
}
function initInteractive(key){
  const c=CONTENT[key]; if(!c) return;
  if(c.match) buildMatch(document.getElementById('match-'+key), c.match.pairs, key);
  (c.sorts||[]).forEach((s,i)=> buildSort(document.getElementById('sort-'+key+'-'+i), s, key+i));
  (c.mathSets||[]).forEach((m,i)=> buildMath(document.getElementById('math-'+key+'-'+i), m, key+i));
  if(c.quiz) buildQuiz(document.getElementById('quiz-'+key), c.quiz, key);
}

/* ---- tabs ---- */
function buildTabs(){
  document.getElementById('tabs').innerHTML = TAB_ORDER.map(t=>`<button id="tab-${t.key}" onclick="show('${t.key}')">${t.label}</button>`).join('');
}
function show(key){
  activeKey=key;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  const tb=document.getElementById('tab-'+key); if(tb)tb.classList.add('active');
  const main=document.getElementById('content');
  main.innerHTML = renderSubject(key);
  initInteractive(key);
  if(allZh){                                   // keep "show all Chinese" on after switching tabs
    document.querySelectorAll('.zh').forEach(e=>e.classList.add('show'));
    document.querySelectorAll('.zhbtn').forEach(b=>b.classList.add('on'));
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---- QUIZ ---- */
const QUIZSTATE={};
function buildQuiz(el, qs, key){
  if(!el) return;
  QUIZSTATE[key]={qs, answered:{}, score:0};
  el.innerHTML = qs.map((q,i)=>`
    <div class="q" id="${key}-q${i}">
      <div class="qtext">Q${i+1}. ${q.isNew?'<span class="newbadge">🆕 NEW 新</span>':''}${bi(q.q.en,q.q.zh)}${spk()}</div>
      <div class="opts">${q.options.map((o,j)=>`<div class="opt" onclick="answerQ('${key}',${i},${j})">${String.fromCharCode(65+j)}. ${bi(o.en,o.zh)}${spk()}</div>`).join('')}</div>
      <div class="explain" hidden>${q.explain?bi('💡 '+q.explain.en,'💡 '+q.explain.zh)+spk():''}</div>
    </div>`).join('')
    + `<div class="scorebar" id="score-${key}">${bi('Score','得分')}: 0 / ${qs.length}</div>`
    + `<button class="btn reset" onclick="show(activeKey)">🔄 ${bi('Try again','重新測驗')}</button>`;
}
function answerQ(key,i,j){
  const st=QUIZSTATE[key]; if(st.answered[i]!=null) return;
  st.answered[i]=j;
  const q=st.qs[i], correct=q.a;
  const qd=document.getElementById(key+'-q'+i);
  qd.querySelectorAll('.opt').forEach((b,k)=>{
    b.classList.add('done');
    if(k===correct) b.classList.add('correct');
    if(k===j && j!==correct) b.classList.add('wrong');
  });
  const ex=qd.querySelector('.explain'); if(ex && ex.innerHTML.trim()) ex.hidden=false;
  if(j===correct){st.score++; popStar(qd);}
  const done=Object.keys(st.answered).length;
  document.getElementById('score-'+key).innerHTML = `${bi('Score','得分')}: ${st.score} / ${st.qs.length}`;
  if(done===st.qs.length) finishBar('score-'+key, st.score, st.qs.length);
}

/* ---- MATCH ---- */
const MATCHSTATE={};
function buildMatch(el, pairs, key){
  if(!el) return;
  const L=pairs.map((p,i)=>({t:p.l,id:i}));
  const R=shuffle(pairs.map((p,i)=>({t:p.r,id:i})));
  MATCHSTATE[key]={sel:null, matched:0, total:pairs.length};
  el.innerHTML = `<p class="hint">${bi('Click an English word, then click its Chinese meaning.','先點英文單字，再點對應的中文意思。')}</p>
    <div class="matchwrap">
      <div class="mcol">${L.map(x=>`<div class="mcell" data-side="L" data-id="${x.id}" onclick="pickMatch('${key}','L',${x.id},this)">${x.t}<button class="spk" type="button" title="聽發音" data-say="${x.t}" onclick="event.stopPropagation();speakEl(this)">🔊</button></div>`).join('')}</div>
      <div class="mcol">${R.map(x=>`<div class="mcell" data-side="R" data-id="${x.id}" onclick="pickMatch('${key}','R',${x.id},this)">${x.t}</div>`).join('')}</div>
    </div>
    <div class="scorebar" id="mscore-${key}">${bi('Matched','配對成功')}: 0 / ${pairs.length}</div>`;
}
function pickMatch(key,side,id,el){
  const st=MATCHSTATE[key]; if(el.classList.contains('matched')) return;
  if(!st.sel){ st.sel={side,id,el}; el.classList.add('sel'); return; }
  if(st.sel.el===el){ el.classList.remove('sel'); st.sel=null; return; }
  if(st.sel.side===side){ st.sel.el.classList.remove('sel'); st.sel={side,id,el}; el.classList.add('sel'); return; }
  // different sides -> check
  if(st.sel.id===id){
    el.classList.add('matched'); st.sel.el.classList.add('matched');
    el.classList.remove('sel'); st.sel.el.classList.remove('sel');
    st.matched++; popStar(el);
    document.getElementById('mscore-'+key).innerHTML=`${bi('Matched','配對成功')}: ${st.matched} / ${st.total}`;
    if(st.matched===st.total) finishBar('mscore-'+key, st.matched, st.total);
    st.sel=null;
  }else{
    const a=st.sel.el; a.classList.add('flash'); el.classList.add('flash');
    setTimeout(()=>{a.classList.remove('flash','sel'); el.classList.remove('flash');},450);
    st.sel=null;
  }
}

/* ---- SORT (buckets) ---- */
const SORTSTATE={};
function buildSort(el, data, key){
  if(!el) return;
  const items=shuffle(data.items.map((it,i)=>({...it,i})));
  SORTSTATE[key]={sel:null, placed:0, total:items.length};
  el.innerHTML = `<p class="hint">${bi('Click a card, then click the correct box.','先點卡片，再點正確的分類框。')}</p>
    <div class="tray" id="tray-${key}">${items.map(it=>`<div class="chip" id="chip-${key}-${it.i}" data-b="${it.b}" onclick="pickChip('${key}',${it.i},this)">${bi(it.en,it.zh)}</div>`).join('')}</div>
    <div class="buckets">${data.buckets.map((b,bi2)=>`<div class="bucket" onclick="dropChip('${key}',${bi2})"><div class="bktitle">${bi(b.en,b.zh)}</div><div class="bkitems" id="bk-${key}-${bi2}"></div></div>`).join('')}</div>
    <div class="scorebar" id="sscore-${key}">${bi('Placed','已分類')}: 0 / ${items.length}</div>`;
}
function pickChip(key,i,el){
  const st=SORTSTATE[key]; if(el.classList.contains('hidden')) return;
  if(st.sel) st.sel.el.classList.remove('sel');
  if(st.sel && st.sel.i===i){ st.sel=null; return; }
  st.sel={i, b:+el.dataset.b, el, label:el.querySelector('.en')?el.querySelector('.en').textContent:el.textContent};
  el.classList.add('sel');
}
function dropChip(key,bucket){
  const st=SORTSTATE[key]; if(!st.sel) return;
  const sel=st.sel;
  if(sel.b===bucket){
    sel.el.classList.add('hidden');
    const bk=document.getElementById('bk-'+key+'-'+bucket);
    const span=document.createElement('span'); span.className='bkchip'; span.textContent=sel.label;
    bk.appendChild(span); popStar(bk);
    st.placed++;
    document.getElementById('sscore-'+key).innerHTML=`${bi('Placed','已分類')}: ${st.placed} / ${st.total}`;
    if(st.placed===st.total) finishBar('sscore-'+key, st.placed, st.total);
    st.sel=null;
  }else{
    sel.el.classList.add('flash');
    setTimeout(()=>{sel.el.classList.remove('flash','sel');},450);
    st.sel=null;
  }
}

/* ---- MATH practice ---- */
const MATHSTATE={};
function buildMath(el, m, key){
  if(!el) return;
  MATHSTATE[key]={m, correct:0, done:{}};
  el.innerHTML = m.questions.map((q,i)=>`
    <div class="mathq">
      <div class="qtext">${i+1}. ${bi(q.q.en,q.q.zh)}</div>
      <div class="mathrow">
        <input class="mans" id="ans-${key}-${i}" placeholder="?" onkeydown="if(event.key==='Enter')checkMath('${key}',${i})">
        <button class="btn small" onclick="checkMath('${key}',${i})">${bi('Check','檢查')}</button>
        <span class="mfb" id="fb-${key}-${i}"></span>
      </div>
    </div>`).join('')
    + `<div class="scorebar" id="mathscore-${key}">${bi('Correct','答對')}: 0 / ${m.questions.length}</div>`;
}
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g,'').replace(/,/g,'');}
function checkMath(key,i){
  const st=MATHSTATE[key]; const q=st.m.questions[i];
  const inp=document.getElementById('ans-'+key+'-'+i);
  const fb=document.getElementById('fb-'+key+'-'+i);
  const val=norm(inp.value); if(val==='') return;
  const accept=[q.ans].concat(q.accept||[]).map(norm);
  let ok=accept.includes(val);
  // numeric tolerance ONLY when the user typed a pure number (rejects "25abc", "6cm", etc.)
  if(!ok && /^[-+]?\d*\.?\d+$/.test(val)){
    const n=parseFloat(val);
    accept.forEach(a=>{const an=parseFloat(a); if(!isNaN(an)&&Math.abs(n-an)<1e-9)ok=true;});
  }
  if(ok){
    fb.textContent='✅ '+(allZh?'答對了!':'Correct!'); fb.className='mfb ok';
    if(!st.done[i]){st.done[i]=1; st.correct++; popStar(fb);}
    inp.disabled=true;
  }else{
    fb.innerHTML='❌ '+bi('Answer: '+q.ans,'答案：'+q.ans); fb.className='mfb no';
    if(st.done[i]===undefined) st.done[i]=0;
  }
  document.getElementById('mathscore-'+key).innerHTML=`${bi('Correct','答對')}: ${st.correct} / ${st.m.questions.length}`;
  const total=st.m.questions.length, answered=Object.keys(st.done).length;
  if(answered===total && !st.finished){ st.finished=1; finishBar('mathscore-'+key, st.correct, total); }
}

/* ---- effects ---- */
function popStar(target){
  const r=target.getBoundingClientRect();
  const s=document.createElement('span'); s.className='star'; s.textContent='⭐'; s.setAttribute('aria-hidden','true');
  s.style.left=(r.left+r.width/2)+'px'; s.style.top=(r.top+window.scrollY)+'px'; s.style.position='absolute';
  document.body.appendChild(s); setTimeout(()=>s.remove(),900);
}
function finishBar(id, score, total){
  const el=document.getElementById(id); if(!el) return;
  if(el.classList.contains('win')) return;   // one-shot: never stack banners / re-fire confetti
  const pct=score/total;
  let msg;
  if(pct===1){msg='🏆 滿分！太棒了 Doby！ Perfect!'; confetti();}
  else if(pct>=0.8){msg='🌟 很厲害！再檢查錯的地方就完美了！'; confetti();}
  else if(pct>=0.6){msg='👍 不錯喔！多複習幾次會更好！';}
  else {msg='💪 沒關係，再試一次！點「中」看中文幫助理解。';}
  el.classList.add('win');
  el.innerHTML += `<div style="margin-top:6px;font-size:.95rem">${msg}</div>`;
}
function confetti(){
  const em=['🎉','⭐','🌟','🎊','✨','🥳'];
  for(let i=0;i<32;i++){
    const c=document.createElement('span'); c.className='confetti'; c.textContent=em[i%em.length]; c.setAttribute('aria-hidden','true');
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    c.style.animationDelay=(Math.random()*0.4)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),3200);
  }
}
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;}
